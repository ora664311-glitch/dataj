    <style>
    /* 基础重置 */
      * {
          margin: 0;
          padding: 0;
          box-sizing: border-box;
      }
      html, body {
          width: 100%;
          height: 100%;
          overflow: hidden;  /* 禁止 body 滚动条 */
          background: white;
      }
      body {
          display: flex;
          flex-direction: column;
      }
      /* 控制面板区域：不滚动，允许换行 */
      .ldavis-toolbar {
          flex-shrink: 0;
          padding: 6px 12px;
          background: white;
          border-bottom: 1px solid #ddd;
          overflow-x: visible;
          overflow-y: visible;
          white-space: normal;
      }
      /* 强制所有控件内联且允许换行 */
      .ldavis-toolbar .row,
      .ldavis-toolbar .col-sm-6,
      .ldavis-toolbar .form-group,
      .ldavis-toolbar .btn-group {
          display: block !important;
          width: auto !important;
          float: none !important;
          overflow: visible !important;
          white-space: normal !important;
      }
      .ldavis-toolbar .col-sm-6 {
          display: inline-block !important;
          width: auto !important;
          margin-right: 15px;
          vertical-align: top;
      }
      /* 滑动条区域 */
      .ldavis-slider {
          margin: 5px 0;
          width: 100%;
          max-width: 400px;
          display: inline-block;
      }
      .ldavis-slider .slider {
          width: 100% !important;
      }
      /* 图表容器 */
      div[id^="ldavis_el"] {
          flex: 1;
          overflow-y: auto;
          background: white;
          min-height: 0;
      }
      /* 隐藏所有水平滚动条（仅控制面板区域） */
      .ldavis-toolbar::-webkit-scrollbar {
          display: none;
      }
      /* 强制 label 不换行过长则截断，但保留文本 */
      .ldavis-toolbar label {
          white-space: nowrap;
          margin-right: 5px;
      }
      html, body {
        overflow: hidden;
      }

      ::-webkit-scrollbar {
        display: none;
      }

      html {
        scrollbar-width: none;
      }
      
    </style>
    
</head>
